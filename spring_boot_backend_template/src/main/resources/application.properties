spring.application.name=resource-booking-system

# Database config
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT config
jwt.secret=${JWT_SECRET:myVeryStrongSecretKey1234567890!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Server config
server.port=${PORT:8080}

# Swagger/OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html


